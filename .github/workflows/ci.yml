name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The bare-checkout path: no database, no credentials. Proves the platform
  # still runs with nothing configured, which is the property it has always had.
  open-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts alembic
      - run: python -m app.nn.train_anomaly_model
      - run: pytest -v
      - run: python scripts/smoke.py

  # The multi-tenant path, against a real PostgreSQL. Not SQLite: row-level
  # security is the control under test and SQLite has no equivalent, so a SQLite
  # run would report green while proving nothing about it.
  tenancy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/netops
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Create the unprivileged application role
        # Created here rather than by a migration, so the role cannot grant
        # itself the attributes that would bypass its own policies.
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d netops -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app WITH LOGIN PASSWORD 'app'
            NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB;
          ALTER DATABASE netops OWNER TO app;
          GRANT ALL ON SCHEMA public TO app;
          SQL

      - run: alembic upgrade head

      - name: Verify row-level security is actually enforced
        # A migration can succeed while leaving policies unenforced, and the
        # service looks entirely healthy in that state. Fail the build here
        # rather than find out from an incident.
        env:
          PGPASSWORD: app
        run: |
          psql -h localhost -U app -d netops -v ON_ERROR_STOP=1 -tAc "
            SELECT count(*) FROM pg_class
            WHERE relnamespace = 'public'::regnamespace AND relkind = 'r'
              AND relrowsecurity AND relforcerowsecurity
          " | grep -qx 5

      - run: python -m app.nn.train_anomaly_model
      - run: pytest -v
