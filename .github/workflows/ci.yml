name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # No database or credentials.
  open-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check app tests scripts alembic
      - run: python -m app.nn.train_anomaly_model
      - run: pytest -v
      - run: python scripts/smoke.py

  # Real Postgres (RLS can't be tested on SQLite) and Redis.
  tenancy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: netops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/netops
      ENVIRONMENT: local

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Create the unprivileged application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d netops -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE app WITH LOGIN PASSWORD 'app'
            NOSUPERUSER NOBYPASSRLS NOCREATEROLE NOCREATEDB;
          ALTER DATABASE netops OWNER TO app;
          GRANT ALL ON SCHEMA public TO app;
          SQL

      - run: alembic upgrade head

      - name: Verify row-level security is actually enforced
        env:
          PGPASSWORD: app
        run: |
          psql -h localhost -U app -d netops -v ON_ERROR_STOP=1 -tAc "
            SELECT count(*) FROM pg_class
            WHERE relnamespace = 'public'::regnamespace AND relkind = 'r'
              AND relrowsecurity AND relforcerowsecurity
          " | grep -qx 6

      - run: python -m app.nn.train_anomaly_model
      - run: pytest -v
