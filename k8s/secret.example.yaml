# Template only. Create the real secret with kubectl or external-secrets.
apiVersion: v1
kind: Secret
metadata:
  name: netops-secrets
  namespace: netops-agents
type: Opaque
stringData:
  # Required. The role must not have SUPERUSER or BYPASSRLS, or row-level
  # security is bypassed and tenants can read each other's data.
  DATABASE_URL: "postgresql+asyncpg://app:REPLACE_ME@postgres:5432/netops"
  # Required, at least 32 characters:
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  JWT_SECRET: "REPLACE_ME"
  # Optional. Enables background /chat runs; needs a Celery worker as well.
  BROKER_URL: ""
  GOOGLE_API_KEY: "REPLACE_ME"
  NEO4J_PASSWORD: "REPLACE_ME"
